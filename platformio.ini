; =================================================================
; PlatformIO Configuration for T2CAN Universal Unlock (ESP32-S3)
; Target Hardware: LILYGO T-2CAN (ESP32-S3-WROOM-1U / N16R8)
; =================================================================

[platformio]
src_dir = .
default_envs = lilygo_t2can

[env:lilygo_t2can]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; MCU Specifications
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = partitions_16mb.csv

; Compiler flags strictly matching firmware safety requirements
build_unflags = -std=gnu++11
build_flags = 
    -std=gnu++17
    -fno-exceptions
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DT2CAN_SERIAL_DIAGNOSTICS=0

build_src_filter = 
    +<*>
    -<tests/>
    -<tools/>
    -<artifacts/>

; Dependencies
lib_deps =
    autowp/autowp-mcp2515 @ ^1.0.3

; Upload and Monitor settings
monitor_speed = 115200
upload_speed = 921600
